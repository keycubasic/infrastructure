---
- name: Установить последнюю версию openjdk-16-jdk
  apt:
    name: openjdk-16-jdk
    state: latest
    install_recommends: no
  become: true

- name: Установить pip
  apt:
    name: python3-pip
    state: present
  become: true

- name: Установить lxml
  pip:
    name: lxml
  become: true

- name: Добавим сервисного пользователя
  user:
    name: "{{ backend_service_user }}"
    groups: admin
  become: true

- name: Создать папку для приложения
  file:
    path: /opt/sausage-store/bin
    state: directory
    owner: "{{ backend_service_user }}"
    group: admin
    mode: 0755
  become: true

- name: Создать папку для логов
  file:
    path: /var/sausage-store/logs
    state: directory
    owner: "{{ backend_service_user }}"
    group: admin
    mode: 0755
  become: true

- name: Создать папку для отчетов
  file:
    path: /var/sausage-store/reports
    state: directory
    owner: "{{ backend_service_user }}"
    group: admin
    mode: 0755
  become: true

- name: Загрузить пакет приложения из Nexus
  maven_artifact:
    dest: /opt/sausage-store/bin/sausage-store.jar
    repository_url: "{{ nexus_url_loc }}/repository/{{ nexus_repo_backend_name }}"
    group_id: "{{ nexus_group_id }}"
    artifact_id: "sausage-store"
    version: "{{ backend_maven_version }}"
    username: "{{ nexus_username_loc }}"
    password: "{{ nexus_password_loc }}"
  become: true

- name: Выдать права на исполняемый файл
  file:
    path: /opt/sausage-store/bin/sausage-store.jar
    owner: "{{ backend_service_user }}"
    group: admin
    mode: 0755
  become: true
    
- name: Шаблонизация конфига управляет настройками приложения с помощью переменных
  template:
    src: backend.service.j2
    dest: /etc/systemd/system/backend.service
  become: true

- name: Перечитываем конфигурацию systemd
  systemd:
    daemon_reload: yes
  become: true

- name: всё готово - запускаем!
  service:
    name: backend
    state: started
    enabled: yes
  become: true

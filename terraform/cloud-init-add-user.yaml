#cloud-config
# Add groups to the system
# The following example adds the 'admingroup' group with members 'root' and 'sys'
# and the empty group ansible.
groups:
  - admingroup: [root,sys]
  - ansible

# Add users to the system. Users are added after groups are added.
users:
  - default
  - name: ansible
    gecos: Ansible User
    shell: /bin/bash
    primary_group: ansible
    groups: users, admin
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: false
    ssh_authorized_keys:
      - ssh-rsa  keycube@yandex.ru
 
 # Downloads the Midnight Commander package
packages:
  - mc

# Run something
runcmd:
  - sudo su ansible
  